services:
  postgres_dev:
    image: pgvector/pgvector:pg16
    container_name: individuum-postgres-dev
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: individuum_mvp_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - individuum-net

  postgres_test:
    image: pgvector/pgvector:pg16
    container_name: individuum-postgres-test
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: individuum_mvp_test
    ports:
      - "5433:5432"   # repara: porta externa 5433, interna 5432
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    networks:
      - individuum-net

  neo4j_dev:
    image: neo4j:5.26-community
    container_name: reflecta-neo4j-dev
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/reflecta_dev}
    ports:
      - "7474:7474"  # Neo4j Browser / HTTP
      - "7687:7687"  # Bolt (aplicação Python)
    volumes:
      - neo4j_data_dev:/data
      - neo4j_logs_dev:/logs
    networks:
      - individuum-net

  rabbitmq:
    image: rabbitmq:management   # você já tem essa imagem
    container_name: individuum-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"    # porta AMQP (app se conecta aqui)
      - "15672:15672"  # painel web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - individuum-net

volumes:
  pgdata_dev:
  pgdata_test:
  neo4j_data_dev:
  neo4j_logs_dev:
  rabbitmq_data:

networks:
  individuum-net:
    name: individuum-net
    driver: bridge

<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#263747" stroke-width="1.3"/></marker></defs><rect width="1180" height="720" fill="white"/>
<text x="590" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17212b"><tspan x="590" dy="0">DSS06  Compartilhar análise contextual com profissional</tspan></text>
<rect x="20" y="65" width="180" height="70" rx="2" fill="#e9edf3" stroke="#667381"/>
<text x="110" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="110" dy="0">Usuário Final</tspan></text>
<line x1="110" y1="135" x2="110" y2="630" stroke="#85909c" stroke-dasharray="6 6"/>
<rect x="500" y="65" width="180" height="70" rx="2" fill="#e9edf3" stroke="#667381"/>
<text x="590" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="590" dy="0">Sistema Reflecta</tspan></text>
<line x1="590" y1="135" x2="590" y2="630" stroke="#85909c" stroke-dasharray="6 6"/>
<rect x="970" y="65" width="180" height="70" rx="2" fill="#e9edf3" stroke="#667381"/>
<text x="1060" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="1060" dy="0">Destinatário</tspan></text>
<line x1="1060" y1="135" x2="1060" y2="630" stroke="#85909c" stroke-dasharray="6 6"/>
<line x1="110" y1="205" x2="590" y2="205" stroke="#263747" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="122" y="167" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="122" dy="0">Conferir síntese e autorizar</tspan><tspan x="122" dy="26">a inclusão opcional das reflexões</tspan></text>
<line x1="110" y1="270" x2="590" y2="270" stroke="#263747" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="122" y="258" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="122" dy="0">Confirmar geração do link</tspan></text>
<line x1="590" y1="335" x2="110" y2="335" stroke="#263747" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="122" y="297" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="122" dy="0">Retornar link revogável</tspan><tspan x="122" dy="26">válido por 72 horas</tspan></text>
<line x1="110" y1="400" x2="1060" y2="400" stroke="#263747" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="122" y="388" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="122" dy="0">Copiar e enviar o link por iniciativa do titular</tspan></text>
<line x1="1060" y1="465" x2="590" y2="465" stroke="#263747" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="602" y="453" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="602" dy="0">Acessar conteúdo com token</tspan></text>
<line x1="590" y1="530" x2="1060" y2="530" stroke="#263747" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="602" y="492" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="602" dy="0">Exibir snapshot autorizado</tspan><tspan x="602" dy="26">se o acesso estiver disponível</tspan></text>
<line x1="110" y1="595" x2="590" y2="595" stroke="#263747" stroke-width="1.5"  marker-end="url(#arr)"/>
<text x="122" y="583" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="122" dy="0">Revogar acesso, se desejado</tspan></text>
<text x="590" y="666" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17212b"><tspan x="590" dy="0">Conteúdo padrão: síntese. Reflexões e análises individuais somente com autorização adicional.</tspan></text>
<text x="590" y="694" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17212b"><tspan x="590" dy="0">Tokens inválidos, expirados ou revogados não permitem consultar o conteúdo.</tspan></text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740"><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#263747" stroke-width="1.3"/></marker></defs><rect width="1180" height="740" fill="white"/>
<text x="590" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17212b"><tspan x="590" dy="0">Compartilhamento da análise contextual</tspan></text>
<text x="590" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="590" dy="0">Esboço dos controles implementados no Reflecta</tspan></text>
<rect x="20" y="95" width="558" height="600" rx="10" fill="white" stroke="#aab2ba"/>
<rect x="602" y="95" width="558" height="600" rx="10" fill="white" stroke="#aab2ba"/>
<text x="42" y="132" text-anchor="start" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17212b"><tspan x="42" dy="0">Criar link a partir de uma análise</tspan></text>
<text x="42" y="172" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17212b"><tspan x="42" dy="0">Síntese do período de 7 dias</tspan></text>
<text x="42" y="205" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="42" dy="0">Resumo, padrões, mudanças e perguntas</tspan></text>
<text x="42" y="247" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="42" dy="0">Acesso por 72 horas a quem possuir o link.</tspan></text>
<rect x="44" y="281" width="20" height="20" rx="2" fill="white" stroke="#667381"/>
<text x="78" y="298" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17212b"><tspan x="78" dy="0">Incluir também as reflexões utilizadas</tspan></text>
<text x="78" y="331" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="78" dy="0">Textos, conclusões individuais da IA,</tspan></text>
<text x="78" y="358" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="78" dy="0">temas mantidos e passagens relacionadas.</tspan></text>
<rect x="44" y="392" width="20" height="20" rx="2" fill="#405642" stroke="#667381"/>
<text x="54" y="409" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="white"><tspan x="54" dy="0">✓</tspan></text>
<text x="78" y="410" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17212b"><tspan x="78" dy="0">Conferi a análise e confirmo</tspan></text>
<text x="78" y="438" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#17212b"><tspan x="78" dy="0">o compartilhamento desse conteúdo.</tspan></text>
<rect x="44" y="470" width="510" height="54" rx="6" fill="#405642" stroke="#405642"/>
<text x="299" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white"><tspan x="299" dy="0">Gerar link válido por 3 dias</tspan></text>
<text x="44" y="563" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="44" dy="0">Após gerar: link, vencimento e botão Copiar link.</tspan></text>
<text x="44" y="597" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="44" dy="0">O titular copia e envia à pessoa escolhida.</tspan></text>
<text x="44" y="649" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17212b"><tspan x="44" dy="0">O link completo aparece somente na criação.</tspan></text>
<text x="626" y="132" text-anchor="start" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17212b"><tspan x="626" dy="0">Acompanhar e revogar links</tspan></text>
<text x="626" y="176" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17212b"><tspan x="626" dy="0">Filtros de status</tspan></text>
<text x="626" y="211" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17212b"><tspan x="626" dy="0">Todos   •   Ativos   •   Expirados   •   Revogados</tspan></text>
<rect x="626" y="246" width="510" height="258" rx="6" fill="#f7f8f9" stroke="#b8bec5"/>
<text x="647" y="281" text-anchor="start" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#17212b"><tspan x="647" dy="0">Análise do período compartilhado</tspan></text>
<text x="647" y="321" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="647" dy="0">Quantidade de reflexões e resumo</tspan></text>
<text x="647" y="357" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="647" dy="0">Data de criação e vencimento do acesso</tspan></text>
<text x="647" y="397" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#17212b"><tspan x="647" dy="0">Estado do link: Ativo</tspan></text>
<rect x="647" y="425" width="245" height="52" rx="6" fill="white" stroke="#405642"/>
<text x="770" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17212b"><tspan x="770" dy="0">Revogar acesso</tspan></text>
<text x="626" y="551" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#17212b"><tspan x="626" dy="0">A revogação impede novas consultas pelo link.</tspan></text>
<text x="626" y="593" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="626" dy="0">A lista não recupera o token original.</tspan></text>
<text x="626" y="635" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="626" dy="0">Não exige e-mail do destinatário</tspan></text>
<text x="626" y="663" text-anchor="start" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#17212b"><tspan x="626" dy="0">nem oferece prazo de acesso personalizado.</tspan></text>
<text x="590" y="726" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#17212b"><tspan x="590" dy="0">Representação esquemática para a documentação; o estilo visual não reproduz uma captura de tela.</tspan></text>
</svg>
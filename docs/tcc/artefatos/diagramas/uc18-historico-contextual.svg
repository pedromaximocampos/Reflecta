<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1050" viewBox="0 0 1180 1050"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#263747" stroke-width="1.3"/></marker></defs><rect width="1180" height="1050" fill="white"/>
<text x="590" y="33" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17212b"><tspan x="590" dy="0">Reflecta  UC18  Criar histórico contextual dos usuários</tspan></text>
